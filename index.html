<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard | Performance Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: #333;
        }

        /* Background - Static, beautiful gradient, zero lag */
        .dashboard-bg {
            background: linear-gradient(135deg, #4e73df 0%, #1cc88a 100%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-logo {
            width: 55px;
            border-radius: 50%;
            border: 2px solid #4e73df;
            padding: 2px;
        }

        .top-left h2 { margin: 0; font-size: 18px; color: #4e73df; font-weight: 600; }
        .top-left p { margin: 0; font-size: 13px; color: #858796; }

        /* Logout Button */
        .logout-modern {
            background: #ffebee;
            color: #e74a3b;
            border: 1px solid #ffcdd2;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-modern:hover {
            background: #e74a3b;
            color: #ffffff;
        }

        /* Dashboard Wrapper & Cards */
        .dashboard-wrapper {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Soft, elegant shadow */
        }

        .card h2 {
            margin-top: 0;
            font-size: 22px;
            color: #4e73df;
            margin-bottom: 25px;
        }

        /* Form Grid */
        .modern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Perfected Floating Inputs */
        .floating-input {
            position: relative;
        }

        .floating-input input {
            width: 100%;
            padding: 12px 10px;
            border: none;
            border-bottom: 2px solid #e3e6f0;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            background: transparent;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .floating-input label {
            position: absolute;
            left: 10px;
            top: 12px;
            color: #858796;
            transition: 0.3s ease;
            pointer-events: none;
        }

        .floating-input input:focus, 
        .floating-input input:not(:placeholder-shown) {
            border-bottom: 2px solid #4e73df;
        }

        .floating-input input:focus + label, 
        .floating-input input:not(:placeholder-shown) + label {
            top: -14px;
            font-size: 12px;
            color: #4e73df;
            font-weight: 600;
        }

        /* Action Buttons */
        .primary-btn, .danger-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .primary-btn {
            background: #4e73df;
            color: white;
            margin-right: 15px;
        }

        .primary-btn:hover {
            background: #2e59d9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.3);
        }

        .danger-btn {
            background: #ffffff;
            color: #e74a3b;
            border: 1px solid #e74a3b;
        }

        .danger-btn:hover {
            background: #e74a3b;
            color: white;
            transform: translateY(-2px);
        }

        /* Table Design */
        .table-card-modern {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fc;
            color: #4e73df;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e3e6f0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e3e6f0;
            color: #5a5c69;
            vertical-align: middle;
        }

        tr:hover td {
            background: #f8f9fc;
        }

        .delete-btn {
            background: #fee2e2;
            color: #e74a3b;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #e74a3b;
            color: white;
        }
    </style>
</head>

<body class="dashboard-bg">

<!-- HEADER -->
<div class="top-bar">
    <div class="top-left">
        <img src="images.jpg" class="top-logo" alt="Logo">
        <div>
            <h2>Keral Verma Subharti College Of Science</h2>
            <p>Department of Computer Science</p>
        </div>
    </div>

    <button class="logout-modern" onclick="logout()">
        <i class="fa fa-sign-out-alt"></i> Logout
    </button>
</div>

<!-- MAIN SECTION -->
<div class="dashboard-wrapper">

    <div class="card form-card">
        <h2><i class="fa fa-chart-line"></i> Student Performance Analysis</h2>

        <div class="modern-grid">
            <div class="floating-input">
                <input id="name" type="text" placeholder=" " required autocomplete="off">
                <label>Student Name</label>
            </div>

            <div class="floating-input">
                <input id="maths" type="number" placeholder=" " required>
                <label>Maths</label>
            </div>

            <div class="floating-input">
                <input id="science" type="number" placeholder=" " required>
                <label>Science</label>
            </div>

            <div class="floating-input">
                <input id="english" type="number" placeholder=" " required>
                <label>English</label>
            </div>

            <div class="floating-input">
                <input id="computer" type="number" placeholder=" " required>
                <label>Computer</label>
            </div>
        </div>

        <button class="primary-btn" onclick="analyze()">
            <i class="fa fa-calculator"></i> Analyze & Save Result
        </button>

        <button class="danger-btn" onclick="clearAll()">
            <i class="fa fa-trash"></i> Clear All Records
        </button>
    </div>

    <!-- TABLE -->
    <div class="card table-card-modern">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Total Score</th>
                    <th>Percentage</th>
                    <th>Result</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="result">
                <!-- Rows will be injected here by JavaScript -->
            </tbody>
        </table>
    </div>

</div>

<!-- INTEGRATED JAVASCRIPT -->
<script>
    // 1. Check if Teacher is logged in
    window.onload = function() {
        if (!localStorage.getItem("currentTeacher")) {
            // Optional: Redirect to login if not logged in
            // window.location.href = "teacher-login.html";
        }
        displayData();
    };

    // Load existing students from local storage
    let students = JSON.parse(localStorage.getItem("students")) || [];

    function analyze() {
        // Get values from inputs
        let name = document.getElementById("name").value.trim();
        let maths = parseInt(document.getElementById("maths").value);
        let science = parseInt(document.getElementById("science").value);
        let english = parseInt(document.getElementById("english").value);
        let computer = parseInt(document.getElementById("computer").value);

        // Validate inputs
        if (!name || isNaN(maths) || isNaN(science) || isNaN(english) || isNaN(computer)) {
            alert("Please enter the student's name and valid numbers for all subjects.");
            return;
        }

        // Calculate Total and Percentage
        let totalMarks = maths + science + english + computer;
        let percentage = (totalMarks / 400) * 100;

        // Determine Pass or Fail (33% passing criteria)
        let resultStatus = percentage >= 33 ? "Pass" : "Fail";

        // Create student object
        let studentData = {
            name: name,
            maths: maths,
            science: science,
            english: english,
            computer: computer,
            total: totalMarks,
            percentage: percentage.toFixed(2),
            result: resultStatus
        };

        // Check if student already exists. Update if yes, add if no.
        let existingIndex = students.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
        if (existingIndex >= 0) {
            students[existingIndex] = studentData;
        } else {
            students.push(studentData);
        }

        // Save and refresh
        localStorage.setItem("students", JSON.stringify(students));
        displayData();

        // Clear input fields
        document.getElementById("name").value = "";
        document.getElementById("maths").value = "";
        document.getElementById("science").value = "";
        document.getElementById("english").value = "";
        document.getElementById("computer").value = "";
    }

    function displayData() {
        let tableBody = document.getElementById("result");
        tableBody.innerHTML = ""; 

        students.forEach((student, index) => {
            // Color code the result
            let statusColor = student.result === "Pass" ? "#1cc88a" : "#e74a3b";
            let statusIcon = student.result === "Pass" ? "fa-check-circle" : "fa-times-circle";
            
            let row = `
                <tr>
                    <td style="font-weight: 600; color: #4e73df;">${student.name}</td>
                    <td><strong style="color: #333;">${student.total}</strong> / 400</td>
                    <td>${student.percentage}%</td>
                    <td style="color: ${statusColor}; font-weight: bold;">
                        <i class="fa ${statusIcon}"></i> ${student.result}
                    </td>
                    <td>
                        <button class="delete-btn" onclick="deleteRow(${index})" title="Delete Student">
                            <i class="fa fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    function deleteRow(index) {
        if(confirm("Are you sure you want to delete this student's record?")) {
            students.splice(index, 1);
            localStorage.setItem("students", JSON.stringify(students));
            displayData();
        }
    }

    function clearAll() {
        if(confirm("DANGER: Are you sure you want to clear ALL student records? This cannot be undone.")) {
            localStorage.removeItem("students");
            students = [];
            displayData();
        }
    }

    function logout() {
        localStorage.removeItem("currentTeacher");
        window.location.href = "teacher-login.html";
    }
</script>

</body>
</html>
