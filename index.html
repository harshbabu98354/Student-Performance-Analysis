<!DOCTYPE html>
<html>
<head>
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="dashboard-bg">

<!-- HEADER -->
<div class="top-bar">
    <div class="top-left">
        <img src="images.jpg" class="top-logo">
        <div>
            <h2>Keral Verma Subharti College Of Science</h2>
            <p>Department of Computer Science</p>
        </div>
    </div>

    <button class="logout-modern" onclick="logout()">
        <i class="fa fa-sign-out-alt"></i> Logout
    </button>
</div>

<!-- MAIN SECTION -->
<div class="dashboard-wrapper">

    <div class="card form-card">

        <h2><i class="fa fa-chart-line"></i> Student Performance Analysis</h2>

        <div class="modern-grid">

            <div class="floating-input">
                <input id="name" required>
                <label>Student Name</label>
            </div>

            <div class="floating-input">
                <input id="maths" type="number" required>
                <label>Maths</label>
            </div>

            <div class="floating-input">
                <input id="science" type="number" required>
                <label>Science</label>
            </div>

            <div class="floating-input">
                <input id="english" type="number" required>
                <label>English</label>
            </div>

            <div class="floating-input">
                <input id="computer" type="number" required>
                <label>Computer</label>
            </div>

        </div>

        <button class="primary-btn" onclick="analyze()">
            <i class="fa fa-calculator"></i> Analyze Result
        </button>

        <button class="danger-btn" onclick="clearAll()">
            <i class="fa fa-trash"></i> Clear All Records
        </button>

    </div>

    <!-- TABLE -->
    <div class="card table-card-modern">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Total</th>
                    <th>%</th>
                    <th>Result</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="result"></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>

<script>
function logout(){
localStorage.removeItem("currentTeacher");
window.location="login.html";
}

function clearAll(){
localStorage.removeItem("students");
location.reload();
}
</script>

</body>
</html>
