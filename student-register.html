<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Create Account</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.3;
            animation: drift 25s infinite alternate;
        }

        .orb-1 { background: #059669; top: -20%; right: -10%; }
        .orb-2 { background: #3b82f6; bottom: -20%; left: -10%; animation-delay: -7s; }

        @keyframes drift {
            from { transform: rotate(0deg) translate(50px) rotate(0deg); }
            to { transform: rotate(360deg) translate(-50px) rotate(-360deg); }
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            z-index: 1;
        }

        .register-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: slideIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--primary);
            font-size: 1.5rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 52px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .input-group input:focus + i {
            color: var(--primary);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(16, 185, 129, 0.4);
        }

        .footer-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .footer-link span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            margin-left: 5px;
        }

        .footer-link span:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="header">
                <div class="icon-box">
                    <i class="fa fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p>Join the Student Portal today</p>
            </div>

            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="username" placeholder="Choose a Username" autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder="Set a Password">
            </div>

            <button class="register-btn" onclick="register()">
                Get Started
            </button>

            <div class="footer-link">
                Already have an account? 
                <span onclick="location.href='student-login.html'">Sign In</span>
            </div>
        </div>
    </div>

    <script>
        function register() {
            // Trim removes any accidental spaces at the end of the username
            let userVal = document.getElementById("username").value.trim();
            let passVal = document.getElementById("password").value;

            if (userVal === "" || passVal === "") {
                alert("Please fill in all fields.");
                return;
            }

            // Using 'studentAccounts' to perfectly match your login page
            let studentAccounts = JSON.parse(localStorage.getItem("studentAccounts")) || [];

            // Check if user already exists
            let exists = studentAccounts.find(s => s.username === userVal);
            
            if (exists) {
                alert("This username is already taken. Try another.");
                return;
            }

            // Save credentials
            studentAccounts.push({
                username: userVal,
                password: passVal
            });

            localStorage.setItem("studentAccounts", JSON.stringify(studentAccounts));

            alert("Account successfully created!");
            window.location.href = "student-login.html";
        }
    </script>
</body>
</html>
