<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Register | Student Performance System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="premium-bg">

<div class="premium-container animate-slide-up">

    <!-- Left Side: Branding (Matches Login) -->
    <div class="premium-left">
        <div class="branding-content">
            <img src="images.jpg" class="premium-logo animate-pulse" alt="University Logo">
            <h1>Join Faculty</h1>
            <div class="divider"></div>
            <p class="college-name">Keral Verma Subharti College Of Science</p>
            <p class="dept-name">Department of Computer Science</p>
        </div>
    </div>

    <!-- Right Side: Registration Form -->
    <div class="premium-right">

        <div class="form-box">
            <div class="form-header">
                <i class="fa fa-user-plus teacher-icon"></i>
                <h2>Teacher Register</h2>
                <p>Create your account to manage student performance</p>
            </div>

            <div class="floating-group">
                <i class="fa fa-user"></i>
                <input type="text" id="username" placeholder=" " required>
                <label>Username</label>
            </div>

            <div class="floating-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder=" " required>
                <label>Password</label>
            </div>

            <button class="premium-btn" onclick="register()">
                <span>Create Account</span>
                <i class="fa fa-user-check"></i>
            </button>

            <div class="register-link">
                <p>Already have an account? <span onclick="location.href='teacher-login.html'">Login Here</span></p>
            </div>

        </div>

    </div>

</div>

<script>
function register() {
    const userVal = document.getElementById("username").value.trim();
    const passVal = document.getElementById("password").value;

    if (userVal === "" || passVal === "") {
        // Shake animation for error
        const box = document.querySelector('.form-box');
        box.classList.add('shake');
        setTimeout(() => box.classList.remove('shake'), 500);
        
        alert("Please fill all fields");
        return;
    }

    // Save credentials
    localStorage.setItem("teacherUser", userVal);
    localStorage.setItem("teacherPass", passVal);

    // Visual feedback before redirect
    alert("Account Created Successfully!");
    
    document.querySelector('.premium-container').classList.add('fade-out');
    
    setTimeout(() => {
        window.location.href = "teacher-login.html";
    }, 500);
}
</script>

</body>
</html>
