<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student Dashboard</h2>
<div id="result"></div>

<script>
let current=localStorage.getItem("currentStudent");
let results=JSON.parse(localStorage.getItem("results"))||[];

let data=results.find(r=>r.username===current);

if(data){
result.innerHTML="Your Marks: "+data.marks;
}else{
result.innerHTML="No Result Found";
}
</script>

</body>
</html>
